# anime 主题配置

# 顶部导航菜单
menu:
  首页: /
  资讯热点: /categories/资讯热点/
  技术博文: /categories/技术博文/
  个人随想: /thoughts/
  归档: /archives/
  关于我: /about/

# 随想瀑布流：前端分页每页条数
thoughts_per_page: 10

# 全站背景壁纸（非首页 hero 区域的页面背景）
# light/dark 分别对应亮/暗主题，留空则为纯色背景
# veil 为遮罩浓度 0-1：越大壁纸越淡（保证正文可读）
background:
  light: /img/wallpapers/wallpaper-19291403720086400.png
  dark: /img/wallpapers/wallpaper-19285794097025920.png
  veil: 0.5

# Waline 评论 + 浏览量服务
# 部署 Waline 后填写 serverURL（如 https://your-waline.vercel.app）
# 留空时：评论区显示占位提示，浏览量隐藏
waline:
  serverURL: https://waline.kiryul.xyz/

# 首页语录切换间隔（毫秒）
quote_interval: 8000

# Live2D 看板娘（oh-my-live2d，CDN 引入，停靠右下角，加载失败静默降级）
# model 需支持跨域且稳定；推荐用 unpkg npm 模型包（model.oml2d.com 国内易 CONNECTION_RESET）
# 更多模型：https://www.npmjs.com/search?q=live2d-widget-model
live2d:
  enable: true
  model: https://unpkg.com/live2d-widget-model-shizuku@1.0.5/assets/shizuku.model.json
  scale: 0.115
  # 模型位置偏移 [x, y]：y 为正向下移；头部（双马尾）被上沿裁切时调大 y
  position: [0, 45]
  # 展示区域尺寸（必须带 px 单位，传纯数字无效）；canvas 自动 2x，放大不变形
  stageWidth: 210px
  stageHeight: 220px
  # 移动端是否展示（小屏易遮挡内容，默认关闭）
  mobile: false

# 音乐播放器（APlayer 悬浮吸底模式，左下角）
music:
  enable: true
  # 方式一（默认）：Meting 在线歌单 —— server: netease/tencent，type: playlist/song/album，id: 歌单 ID
  meting:
    server: tencent
    type: playlist
    id: '9755654764'   # QQ 音乐公开歌单 ID（y.qq.com 分享链接 /playlist/ 后的数字）
  # 方式二：自维护歌曲列表（填写后优先于 meting，音频文件放 source/music/ 下）
  # songs:
  #   - name: 歌名
  #     artist: 歌手
  #     url: /music/song.mp3
  #     cover: /img/cover.jpg

# 页脚
footer:
  since: 2026
  text: '用 ❤ 与 Hexo 构建'
